# http://<servidor>/          -> painel do atendente / administrador
# http://<servidor>/painel/   -> painel da TV
# http://<servidor>/api       -> backend (também usado pelo totem)
# http://<servidor>/socket.io -> tempo real (painéis, totem e agente de impressão)

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  client_max_body_size 1m;

  location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A geração da senha aguarda a confirmação da impressora (até ~8 s)
    proxy_read_timeout 30s;
  }

  location /socket.io/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Painéis ficam conectados o dia todo
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Arquivos com hash no nome podem ficar em cache por muito tempo
  location ~ ^/(painel/)?static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /painel/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /painel/index.html;
  }

  location = /painel {
    return 301 /painel/;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
